services:
  - type: web
    name: lead-gen-agent
    runtime: docker
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lead-gen-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false   # set in Render dashboard (secret)
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: YELP_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
databases:
  - name: lead-gen-db
    plan: basic
